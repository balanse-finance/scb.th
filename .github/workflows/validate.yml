name: Validate and release bank templates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bank-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - id: release
        run: node scripts/check-release.mjs
  publish:
    needs: validate
    if: github.event_name == 'push' && needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -1 "$TAG")" = "$GITHUB_SHA"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
          gh release view "$TAG" --json isImmutable,isDraft --jq 'select(.isImmutable and (.isDraft | not))' | grep -q .
